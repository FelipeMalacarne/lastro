# Only what local development needs. Ollama runs on zaros.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lastro
      POSTGRES_PASSWORD: lastro
      POSTGRES_DB: lastro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastro"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
