# Reference only: NOT part of the kustomization and NEVER committed with real values.
# The real Secret lives in gielinor (clusters/saradomin/apps/lastro/secrets.yaml), encrypted
# with SOPS. Keep the keys here in step with it.
apiVersion: v1
kind: Secret
metadata:
  name: lastro-secrets
type: Opaque
stringData:
  LASTRO_DATABASE_URL: postgres://lastro:CHANGE_ME@postgres-main-rw.databases.svc:5432/lastro?sslmode=require
  LASTRO_CF_ACCESS_TEAM_DOMAIN: your-team.cloudflareaccess.com
  LASTRO_CF_ACCESS_AUD: CHANGE_ME
  # Sign-in through Zitadel (ADR-0008, docs/zitadel.md); off while LASTRO_OIDC_ISSUER is empty.
  LASTRO_PUBLIC_URL: https://lastro.ftm.dev.br
  LASTRO_OIDC_ISSUER: ""
  LASTRO_OIDC_AUDIENCE: ""
  LASTRO_OIDC_OWNER_SUBJECT: ""
  LASTRO_OIDC_SCOPES: ""
  LASTRO_OIDC_WEB_CLIENT_ID: ""
  LASTRO_OIDC_WEB_CLIENT_SECRET: ""
  LASTRO_SESSION_KEY: ""
  LASTRO_OIDC_CLI_CLIENT_ID: ""
  LASTRO_OIDC_WRITE_CLIENTS: ""
  LASTRO_OLLAMA_URL: ""
  LASTRO_OLLAMA_MODEL: ""
  LASTRO_PLUGGY_CLIENT_ID: ""
  LASTRO_PLUGGY_CLIENT_SECRET: ""
  LASTRO_PLUGGY_ITEM_IDS: ""
  LASTRO_BRAPI_TOKEN: ""
  LASTRO_TELEGRAM_BOT_TOKEN: ""
  LASTRO_TELEGRAM_CHAT_ID: ""
