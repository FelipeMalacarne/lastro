apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lastro
# The namespace, the Postgres and the lastro-secrets Secret belong to the cluster:
# gielinor creates them in clusters/saradomin/apps/lastro, with the Secret encrypted by SOPS.
# This overlay only says how the app runs.
resources:
  - ../../base
  - ingress.yaml
images:
  - name: lastro
    newName: ghcr.io/felipemalacarne/lastro
    # CI sets this to the image it just pushed, on every merge to main.
    newTag: "099a7bf025560de1e3fac3e2499d3ddfd4eec180"
