apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lastro
# The namespace, the database and the lastro-secrets Secret belong to the cluster. gielinor
# creates them: the database `lastro` on the shared CloudNativePG cluster
# (clusters/saradomin/apps/postgres) and the Secret, encrypted by SOPS, in apps/lastro.
# This overlay only says how the app runs.
resources:
  - ../../base
  - ingress.yaml
images:
  - name: lastro
    newName: ghcr.io/felipemalacarne/lastro
    # CI sets this to the image it just pushed, on every merge to main.
    newTag: "b842ba8c7791e8188c8843dab1111676668880fd"
