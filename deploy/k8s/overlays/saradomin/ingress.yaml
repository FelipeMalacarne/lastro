# Public only through the saradomin Cloudflare tunnel; lastro signs in by itself against
# Zitadel (ADR-0008). There is no LAN host: the issuer and the redirects are the public
# URL, so the same origin everywhere keeps the login working.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lastro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: lastro.ftm.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lastro
                port:
                  name: http
