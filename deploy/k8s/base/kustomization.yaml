apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - cronjob-sync.yaml
labels:
  - pairs:
      app.kubernetes.io/name: lastro
    includeSelectors: true
configMapGenerator:
  - name: lastro-config
    literals:
      - LASTRO_ENV=prod
      - LASTRO_HTTP_ADDR=:8080
      - LASTRO_LOG_LEVEL=info
