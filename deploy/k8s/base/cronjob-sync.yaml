apiVersion: batch/v1
kind: CronJob
metadata:
  name: lastro-sync
spec:
  # Meu Pluggy refreshes each bank once a day; reading four times a day keeps
  # lastro at most six hours behind it. Reads are cheap: they come from
  # Pluggy's copy, not from the bank.
  schedule: "17 */6 * * *"
  timeZone: America/Sao_Paulo
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: lastro
              args: ["sync"]
              envFrom:
                - configMapRef:
                    name: lastro-config
                - secretRef:
                    name: lastro-secrets
                - secretRef:
                    name: lastro-pluggy
                    optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
