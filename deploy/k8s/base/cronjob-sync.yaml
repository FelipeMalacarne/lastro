apiVersion: batch/v1
kind: CronJob
metadata:
  name: lastro-sync
spec:
  schedule: "0 */6 * * *"
  timeZone: America/Sao_Paulo
  # Turned on in Phase 1, once `lastro sync` exists.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: lastro
              args: ["sync"]
              envFrom:
                - configMapRef:
                    name: lastro-config
                - secretRef:
                    name: lastro-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
