# golangci-lint v2
version: "2"

run:
  # Lint the integration tests too.
  build-tags: [integration]

linters:
  enable:
    - depguard
    - errorlint
    - gocritic
  settings:
    depguard:
      rules:
        # Inside a module, only repository.go, http.go and internal/ talk to the
        # database and HTTP. Aggregates, value objects and services stay pure.
        pure-domain:
          list-mode: lax
          files:
            - "**/modules/**/*.go"
            - "!**/modules/**/repository.go"
            - "!**/modules/**/http.go"
            - "!**/modules/**/internal/**"
            - "!$test"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "the domain does not talk to the database: use repository.go"
            - pkg: "net/http"
              desc: "HTTP belongs in http.go"
            - pkg: "lastro/platform/llm"
              desc: "declare an interface in the module and receive the client through the constructor"
        # The money kernel depends only on the standard library.
        pure-kernel:
          list-mode: strict
          files:
            - "**/money/*.go"
          allow:
            - $gostd
        # The lastro CLI is a client: everything goes through the HTTP API (ADR-0010).
        # It knows no module, no database and nothing the server is configured with.
        client:
          list-mode: lax
          files:
            - "**/cmd/lastro/**"
            # Tests may reach the server: they check the client against it.
            - "!$test"
          deny:
            - pkg: "lastro/app"
              desc: "the client talks to the server through the API, never in process"
            - pkg: "lastro/modules"
              desc: "the client knows no module: give it its own wire types"
            - pkg: "lastro/platform"
              desc: "platform is the server's infrastructure"
            - pkg: "lastro/web"
              desc: "the frontend is embedded in lastrod, not in the client"
            - pkg: "github.com/jackc/pgx"
              desc: "the client never talks to the database"
