name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags integration ./...
      - run: go test ./...
      # Repositories against a real Postgres (testcontainers; the runner has Docker).
      - run: go test -tags integration ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run
      - name: Kubernetes manifests
        run: kubectl kustomize deploy/k8s/overlays/saradomin > /dev/null

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time: two runs bumping the same line race, and the older could win.
    concurrency:
      group: deploy-saradomin
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The deploy step compares this commit with main's history.
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase names, and the owner here has uppercase letters.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lastro" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      # Argo CD on saradomin follows this overlay on main, so pointing it at the image just
      # pushed is the deploy. A push made with GITHUB_TOKEN does not start another run.
      # If main already has newer commits than this run's (other than deploy bumps), their
      # run deploys and this one stands down, so an older image never replaces a newer one.
      - name: Deploy to saradomin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            if git log --format=%s "${GITHUB_SHA}..origin/main" | grep -qv '^deploy: saradomin runs '; then
              echo "main moved past ${GITHUB_SHA::7}; the newer run deploys"
              exit 0
            fi
            git checkout --quiet -B deploy origin/main
            sed -i "s|^    newTag: .*|    newTag: \"${GITHUB_SHA}\"|" deploy/k8s/overlays/saradomin/kustomization.yaml
            git diff --quiet && exit 0
            git commit --quiet -am "deploy: saradomin runs ${GITHUB_SHA::7}"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
