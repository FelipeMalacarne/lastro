# One block per module with queries. The schema comes from the goose
# migrations themselves (sqlc skips the Down sections).
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: modules/ledger/queries.sql
    gen:
      go:
        package: db
        out: modules/ledger/internal/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int2
            go_type: int16
          - db_type: pg_catalog.int2
            nullable: true
            go_type:
              type: int16
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: modules/ingest/queries.sql
