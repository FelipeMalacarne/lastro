<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>lastro</title>
    <script>
      // Pick the theme before the first paint, so dark mode never flashes light.
      // A choice made in Settings (or with the sidebar's moon) wins over the device's.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("lastro.theme");
        } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
