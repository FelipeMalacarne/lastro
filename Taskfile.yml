# https://taskfile.dev
version: "3"

dotenv: [".env"]

tasks:
  setup:
    desc: Download Go and frontend dependencies
    cmds:
      - go mod tidy
      - npm --prefix web install

  db:
    desc: Start the local Postgres on :55432 (every worktree shares it, each with its own database)
    cmds:
      - docker compose up -d --wait postgres

  migrate:
    desc: Apply migrations to the database in .env
    cmds:
      - go run ./cmd/lastrod migrate

  dev:
    desc: Start the API on LASTRO_HTTP_ADDR (run `task web:dev` in another terminal, or `task up` for both)
    deps: [db]
    cmds:
      - go run ./cmd/lastrod serve

  up:
    desc: Start the API and the frontend together
    deps: [dev, web:dev]

  seed:
    desc: Fill the dev database with made-up money (LASTRO_ENV=dev only; running it again changes nothing)
    cmds:
      - go run ./cmd/lastrod seed

  urls:
    desc: Print where this checkout serves the API and the frontend
    silent: true
    cmds:
      - echo "API       http://localhost${LASTRO_HTTP_ADDR:-:8080}"
      - echo "Frontend  http://localhost:${LASTRO_WEB_PORT:-5173}"

  app:
    desc: Run the whole app in Docker (Postgres, migrations, API with the embedded frontend) on :8080, one worktree at a time
    cmds:
      - docker compose --profile app up --build

  web:dev:
    desc: Start the frontend on LASTRO_WEB_PORT with a proxy to the API
    dir: web
    cmds:
      - npm run dev

  web:check:
    desc: Type-check the frontend
    dir: web
    cmds:
      - npm run typecheck

  web:build:
    desc: Build web/dist, which the Go binary embeds
    dir: web
    cmds:
      - npm run build

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  test:integration:
    desc: Run the integration tests too (repositories against a real Postgres; needs Docker)
    cmds:
      - go test -tags integration ./...

  lint:
    desc: Run golangci-lint (includes the depguard boundary rules)
    cmds:
      - golangci-lint run

  check:
    desc: Tests, lint and the frontend type check (CI also runs the integration tests)
    cmds:
      - task: test
      - task: lint
      - task: web:check

  sqlc:
    desc: Generate query code from migrations and each module's queries.sql
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate

  build:
    desc: Local binaries at bin/lastrod (server) and bin/lastro (client)
    deps: [web:build]
    cmds:
      - CGO_ENABLED=0 go build -o bin/lastrod ./cmd/lastrod
      - CGO_ENABLED=0 go build -o bin/lastro ./cmd/lastro

  image:
    desc: Local Docker image
    cmds:
      - docker build -t lastro:dev .
